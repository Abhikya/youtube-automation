name: YouTube Production
run-name: YouTube Production - ${{ inputs.channel_key || 'minute_mysteries' }} - ${{ inputs.operation || 'prepare' }}

on:
  workflow_dispatch:
    inputs:
      channel_key:
        description: Registered production channel key
        required: false
        type: string
        default: minute_mysteries
      operation:
        description: Prepare tomorrow or conservatively clean historical READY batches
        required: true
        type: choice
        options: [prepare, cleanup]
        default: prepare
      day:
        description: 'Target publication date YYYY-MM-DD; blank means tomorrow in IST'
        required: false
        type: string
      confirmed_not_uploaded_slot:
        description: 'Slot manually verified as not uploaded; blank means none'
        required: false
        type: string
        default: ''

concurrency:
  group: production-${{ inputs.channel_key || 'minute_mysteries' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: write

jobs:
  production:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Resolve production channel
        id: channel
        env:
          INPUT_CHANNEL_KEY: ${{ inputs.channel_key || 'minute_mysteries' }}
        run: |
          python - <<'PY'
          import os
          from config.channels import resolve_channel_config
          channel = resolve_channel_config(os.environ['INPUT_CHANNEL_KEY'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'channel_key={channel.channel_key}\n')
              output.write(f'credential_reference={channel.credential_reference}\n')
              output.write(f'youtube_channel_id={channel.youtube_channel_id}\n')
          PY
      - name: Install FFmpeg for preparation
        if: inputs.operation != 'cleanup'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install official artifact client in runner scratch space
        run: npm install --prefix "$RUNNER_TEMP/artifact-client" --no-audit --no-fund --ignore-scripts @actions/artifact@2.3.2
      - name: Prepare tomorrow with durable artifact checkpoints
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_DAY: ${{ inputs.day }}
          INPUT_CONFIRMED_NOT_UPLOADED_SLOT: ${{ inputs.confirmed_not_uploaded_slot }}
          OPENAI_API_KEY: ${{ inputs.operation != 'cleanup' && secrets.OPENAI_API_KEY || '' }}
          PEXELS_API_KEY: ${{ inputs.operation != 'cleanup' && secrets.PEXELS_API_KEY || '' }}
          SELECTED_YOUTUBE_TOKEN: ${{ inputs.operation != 'cleanup' && secrets[steps.channel.outputs.credential_reference] || '' }}
          CHANNEL_CREDENTIAL_REFERENCE: ${{ steps.channel.outputs.credential_reference }}
          YOUTUBE_CHANNEL_ID: ${{ steps.channel.outputs.youtube_channel_id }}
          TELEGRAM_BOT_TOKEN: ${{ inputs.operation != 'cleanup' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ inputs.operation != 'cleanup' && secrets.TELEGRAM_CHAT_ID || '' }}
          YOUTUBE_PRIVACY_STATUS: private
          FFMPEG_BINARY: /usr/bin/ffmpeg
          IMAGEIO_FFMPEG_EXE: /usr/bin/ffmpeg
          PYTHONUNBUFFERED: '1'
        with:
          script: |
            const inputs = context.payload.inputs || {};
            const operation = inputs.operation || 'prepare';
            const args = ['run_actions.py', operation, '--channel-key', inputs.channel_key || 'minute_mysteries'];
            if (inputs.day) args.push('--day', inputs.day);
            if (inputs.confirmed_not_uploaded_slot) {
              args.push('--confirmed-not-uploaded-slot', inputs.confirmed_not_uploaded_slot);
            }
            await exec.exec('python', args, {env: {...process.env,
              [process.env.CHANNEL_CREDENTIAL_REFERENCE]: process.env.SELECTED_YOUTUBE_TOKEN || '',
              ARTIFACT_MODULE: `${process.env.RUNNER_TEMP}/artifact-client/node_modules/@actions/artifact`}});
